[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newsletter-automation"
version = "0.1.0"
description = "Config-driven pipeline that gathers, drafts, and renders a newsletter issue for human review"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nicholas Mohnacky" }]
keywords = ["newsletter", "email", "automation", "llm", "claude", "editorial"]
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.28",
  "feedparser>=6.0",
  "python-dotenv>=1.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://github.com/mohnacky/newsletter-automation"
Issues = "https://github.com/mohnacky/newsletter-automation/issues"

[project.scripts]
newsletter = "newsletter.run:main"

[tool.setuptools.packages.find]
where = ["src"]
