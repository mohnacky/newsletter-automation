name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Demo run needs no API keys
        env:
          ANTHROPIC_API_KEY: ""
        run: python -m newsletter --demo --issue 1
